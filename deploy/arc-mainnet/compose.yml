name: wizpay-arc-mainnet

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      WIZPAY_ARC_NETWORK: arc-mainnet
      WIZPAY_API_NETWORK: arc-mainnet
      WIZPAY_WORKER_NETWORK: arc-mainnet
      WIZPAY_MIGRATION_NETWORK: arc-mainnet
      ARC_MAINNET_DATABASE_URL: ${ARC_MAINNET_DATABASE_URL:?required}
      ARC_MAINNET_REDIS_URL: ${ARC_MAINNET_REDIS_URL:?required}
      ARC_MAINNET_QUEUE_PREFIX: ${ARC_MAINNET_QUEUE_PREFIX:?required}
      CIRCLE_MAINNET_API_BASE_URL: ${CIRCLE_MAINNET_API_BASE_URL:?required}
      CIRCLE_MAINNET_API_KEY: ${CIRCLE_MAINNET_API_KEY:?required}
      CIRCLE_MAINNET_ENTITY_SECRET: ${CIRCLE_MAINNET_ENTITY_SECRET:?required}
      CIRCLE_MAINNET_WALLET_SET_ID: ${CIRCLE_MAINNET_WALLET_SET_ID:?required}
      CIRCLE_MAINNET_WALLET_ID: ${CIRCLE_MAINNET_WALLET_ID:?required}
      CIRCLE_MAINNET_WALLET_ADDRESS: ${CIRCLE_MAINNET_WALLET_ADDRESS:?required}
      CIRCLE_MAINNET_RECEIPT_CONFIRMATIONS: ${CIRCLE_MAINNET_RECEIPT_CONFIRMATIONS:?required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [arc-mainnet]

  migrate:
    profiles: [migration]
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    command: npm run prisma:migrate:arc-mainnet -w backend
    environment:
      WIZPAY_ARC_NETWORK: arc-mainnet
      WIZPAY_MIGRATION_NETWORK: arc-mainnet
      ARC_MAINNET_DATABASE_URL: ${ARC_MAINNET_DATABASE_URL:?required}
    networks: [arc-mainnet]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${ARC_MAINNET_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${ARC_MAINNET_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${ARC_MAINNET_POSTGRES_DATABASE:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [arc-mainnet-postgres:/var/lib/postgresql/data]
    networks: [arc-mainnet]

  redis:
    image: redis:7-alpine
    volumes: [arc-mainnet-redis:/data]
    networks: [arc-mainnet]

networks:
  arc-mainnet:
    name: wizpay-arc-mainnet

volumes:
  arc-mainnet-postgres:
    name: wizpay-arc-mainnet-postgres
  arc-mainnet-redis:
    name: wizpay-arc-mainnet-redis
