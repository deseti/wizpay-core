name: wizpay-arc-mainnet

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      WIZPAY_ARC_NETWORK: arc-mainnet
      WIZPAY_API_NETWORK: arc-mainnet
      WIZPAY_WORKER_NETWORK: arc-mainnet
      WIZPAY_MIGRATION_NETWORK: arc-mainnet
      ARC_MAINNET_DATABASE_URL: ${ARC_MAINNET_DATABASE_URL:?required}
      ARC_MAINNET_REDIS_URL: ${ARC_MAINNET_REDIS_URL:?required}
      ARC_MAINNET_QUEUE_PREFIX: ${ARC_MAINNET_QUEUE_PREFIX:?required}
      PORT: ${PORT:-4000}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      WIZPAY_ARC_MAINNET_CAPABILITY_SEND: ${WIZPAY_ARC_MAINNET_CAPABILITY_SEND:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_SAME_TOKEN_PAYROLL: ${WIZPAY_ARC_MAINNET_CAPABILITY_SAME_TOKEN_PAYROLL:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_INVOICE: ${WIZPAY_ARC_MAINNET_CAPABILITY_INVOICE:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_PAYMENT_LINK: ${WIZPAY_ARC_MAINNET_CAPABILITY_PAYMENT_LINK:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_BRIDGE: ${WIZPAY_ARC_MAINNET_CAPABILITY_BRIDGE:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_SWAP: ${WIZPAY_ARC_MAINNET_CAPABILITY_SWAP:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_CROSS_TOKEN_PAYROLL: ${WIZPAY_ARC_MAINNET_CAPABILITY_CROSS_TOKEN_PAYROLL:-false}
      CCTP_IRIS_API_BASE_URL: ${CCTP_IRIS_API_BASE_URL:-https://iris-api.circle.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [arc-mainnet]

  migrate:
    profiles: [migration]
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    command: npm run prisma:migrate:arc-mainnet -w backend
    environment:
      WIZPAY_ARC_NETWORK: arc-mainnet
      WIZPAY_MIGRATION_NETWORK: arc-mainnet
      ARC_MAINNET_DATABASE_URL: ${ARC_MAINNET_DATABASE_URL:?required}
    networks: [arc-mainnet]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${ARC_MAINNET_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${ARC_MAINNET_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${ARC_MAINNET_POSTGRES_DATABASE:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [arc-mainnet-postgres:/var/lib/postgresql/data]
    networks: [arc-mainnet]

  redis:
    image: redis:7-alpine
    volumes: [arc-mainnet-redis:/data]
    networks: [arc-mainnet]

networks:
  arc-mainnet:
    name: wizpay-arc-mainnet

volumes:
  arc-mainnet-postgres:
    name: wizpay-arc-mainnet-postgres
  arc-mainnet-redis:
    name: wizpay-arc-mainnet-redis
