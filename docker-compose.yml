services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wizpay}:${POSTGRES_PASSWORD:-wizpay}@postgres:5432/${POSTGRES_DB:-wizpay}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCKER: "true"
      # ── CORS ─────────────────────────────────────────────────────────────
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # ── Chain / RPC config ───────────────────────────────────────────────
      RPC_URL: ${RPC_URL:-https://rpc.testnet.arc.io}
      ARC_RPC_URL: ${ARC_RPC_URL:-https://rpc.testnet.arc.io}
      CHAIN_ID: ${CHAIN_ID:-5042002}
      ETH_SEPOLIA_RPC_URL: ${ETH_SEPOLIA_RPC_URL:-}
      ARC_TESTNET_RPC_URL: ${ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
      ETHEREUM_SEPOLIA_RPC_URL: ${ETHEREUM_SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      ARBITRUM_SEPOLIA_RPC_URL: ${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      OP_SEPOLIA_RPC_URL: ${OP_SEPOLIA_RPC_URL:-https://sepolia.optimism.io}
      MONAD_TESTNET_RPC_URL: ${MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
      CCTP_IRIS_BASE_URL: ${CCTP_IRIS_BASE_URL:-https://iris-api-sandbox.circle.com/v2}
      NEXT_PUBLIC_ARC_TESTNET_RPC_URL: ${NEXT_PUBLIC_ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
      NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL:-}
      SOLANA_DEVNET_RPC_URL: ${SOLANA_DEVNET_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_DEVNET_AIRDROP_LAMPORTS: ${SOLANA_DEVNET_AIRDROP_LAMPORTS:-10000000}
      # ── Circle API ────────────────────────────────────────────────────────
      CIRCLE_API_KEY: ${CIRCLE_API_KEY}
      CIRCLE_BASE_URL: ${CIRCLE_BASE_URL}
      CIRCLE_ENTITY_SECRET: ${CIRCLE_ENTITY_SECRET}
      CIRCLE_WALLETS_BASE_URL: ${CIRCLE_WALLETS_BASE_URL}
      CIRCLE_TRANSFER_BLOCKCHAIN: ${CIRCLE_TRANSFER_BLOCKCHAIN}
      CIRCLE_TRANSFER_FEE_LEVEL: ${CIRCLE_TRANSFER_FEE_LEVEL}
      # ── Circle Wallets ────────────────────────────────────────────────────
      CIRCLE_WALLET_ID_ARC: ${CIRCLE_WALLET_ID_ARC}
      CIRCLE_WALLET_ID_SEPOLIA: ${CIRCLE_WALLET_ID_SEPOLIA}
      CIRCLE_WALLET_ID_SOLANA: ${CIRCLE_WALLET_ID_SOLANA}
      CIRCLE_WALLET_SET_ID_ARC: ${CIRCLE_WALLET_SET_ID_ARC}
      CIRCLE_WALLET_SET_ID_SEPOLIA: ${CIRCLE_WALLET_SET_ID_SEPOLIA}
      CIRCLE_WALLET_SET_ID_SOLANA: ${CIRCLE_WALLET_SET_ID_SOLANA}
      CIRCLE_WALLET_ADDRESS_ARC: ${CIRCLE_WALLET_ADDRESS_ARC}
      CIRCLE_WALLET_ADDRESS_SEPOLIA: ${CIRCLE_WALLET_ADDRESS_SEPOLIA}
      CIRCLE_WALLET_ADDRESS_SOLANA: ${CIRCLE_WALLET_ADDRESS_SOLANA}
      # ── Feature flags ────────────────────────────────────────────────────
      WIZPAY_OFFICIAL_SWAP_ENABLED: ${WIZPAY_OFFICIAL_SWAP_ENABLED:-false}
      WIZPAY_OFFICIAL_SWAP_EXECUTOR: ${WIZPAY_OFFICIAL_SWAP_EXECUTOR:-disabled}
      WIZPAY_OFFICIAL_SWAP_ALLOW_TESTNET_CLI: ${WIZPAY_OFFICIAL_SWAP_ALLOW_TESTNET_CLI:-false}
      APP_WALLET_XYLONET_USER_CONTROLLED_ENABLED: ${APP_WALLET_XYLONET_USER_CONTROLLED_ENABLED:-true}
      APP_XYLONET_ROUTER_ADDRESSES: ${APP_XYLONET_ROUTER_ADDRESSES:-0x73742278c31a76dBb0D2587d03ef92E6E2141023}
      WIZPAY_SWAP_EXECUTOR_V2_ADDRESS: ${WIZPAY_SWAP_EXECUTOR_V2_ADDRESS:-0x7B5573759576AD3AD9F9E3b4425ad68FD2b525ed}
      APP_XYLONET_CHAIN_ID: ${APP_XYLONET_CHAIN_ID:-5042002}
      APP_XYLONET_TOKEN_ADDRESSES: ${APP_XYLONET_TOKEN_ADDRESSES:-USDC=0x3600000000000000000000000000000000000000,EURC=0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a}
      APP_XYLONET_DEADLINE_MAX_SECONDS: ${APP_XYLONET_DEADLINE_MAX_SECONDS:-1200}
      WIZPAY_FEE_SAFE: ${WIZPAY_FEE_SAFE:-0xAA557eb00063ad487BFe0304Bd04B4d45114b721}
      # StableFX variables remain temporarily for the Phase 3 payroll migration.
      CIRCLE_STABLEFX_API_KEY: ${CIRCLE_STABLEFX_API_KEY:-}
      USE_REAL_STABLEFX: ${USE_REAL_STABLEFX:-false}
      WIZPAY_STABLEFX_FALLBACK_TO_SWAPKIT: ${WIZPAY_STABLEFX_FALLBACK_TO_SWAPKIT:-false}
      APP_WALLET_TREASURY_SWAP_EXECUTION_ENABLED: ${APP_WALLET_TREASURY_SWAP_EXECUTION_ENABLED:-false}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wizpay-network

  redis:
    image: redis:7-alpine
    container_name: wizpay-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - wizpay-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # ── Build-time args ───────────────────────────────────────────────────
      # docker-compose auto-loads the root .env file, so ${VAR} here resolves
      # from .env without any shell export. Values are baked into the Next.js
      # bundle during `npm run build` in the Dockerfile builder stage.
      #
      # To change a value: edit root .env, then rebuild with:
      #   docker compose down && docker compose up --build
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL: ${NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_BACKEND_API_BASE_URL: ${NEXT_PUBLIC_BACKEND_API_BASE_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
        NEXT_PUBLIC_INVOICE_API_PREFIX: ${NEXT_PUBLIC_INVOICE_API_PREFIX:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_CIRCLE_APP_ID: ${NEXT_PUBLIC_CIRCLE_APP_ID}
        NEXT_PUBLIC_CIRCLE_KIT_KEY: ${NEXT_PUBLIC_CIRCLE_KIT_KEY:-}
        NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_KEY: ${NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_KEY}
        NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_URL: ${NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_URL}
        NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ARC_TESTNET: ${NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ARC_TESTNET:-}
        NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ETH_SEPOLIA: ${NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ETH_SEPOLIA:-}
        NEXT_PUBLIC_CIRCLE_PASSKEY_RP_ID: ${NEXT_PUBLIC_CIRCLE_PASSKEY_RP_ID:-app.wizpay.xyz}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://rpc.testnet.arc.io}
        NEXT_PUBLIC_ARC_TESTNET_RPC_URL: ${NEXT_PUBLIC_ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
        NEXT_PUBLIC_ARC_MAINNET_EXPLORER_URL: ${NEXT_PUBLIC_ARC_MAINNET_EXPLORER_URL:-}
        NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL:-}
        NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URLS: ${NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URLS:-}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
        NEXT_PUBLIC_OP_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_OP_SEPOLIA_RPC_URL:-https://sepolia.optimism.io}
        NEXT_PUBLIC_MONAD_TESTNET_RPC_URL: ${NEXT_PUBLIC_MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
        NEXT_PUBLIC_USE_REAL_STABLEFX: ${NEXT_PUBLIC_USE_REAL_STABLEFX:-false}
        NEXT_PUBLIC_CIRCLE_API_PROXY_ENABLED: ${NEXT_PUBLIC_CIRCLE_API_PROXY_ENABLED:-false}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_ARC_USDC: ${NEXT_PUBLIC_ARC_USDC:-}
        NEXT_PUBLIC_WIZPAY_SWAP_EXECUTOR_V2_ADDRESS: ${WIZPAY_SWAP_EXECUTOR_V2_ADDRESS:-0x7B5573759576AD3AD9F9E3b4425ad68FD2b525ed}
        NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-}
        NEXT_PUBLIC_WIZPAY_ADDRESS: ${NEXT_PUBLIC_WIZPAY_ADDRESS:-}
        NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS: ${NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS:-}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      # ── Frontend runtime vars (Next.js dev server / SSR) ───────────────────
      # Keep these sourced from the root .env so docker-compose.dev does not
      # depend on apps/frontend/.env.local.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL: ${NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKEND_API_BASE_URL: ${NEXT_PUBLIC_BACKEND_API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_INVOICE_API_PREFIX: ${NEXT_PUBLIC_INVOICE_API_PREFIX:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_CIRCLE_APP_ID: ${NEXT_PUBLIC_CIRCLE_APP_ID:-}
      NEXT_PUBLIC_CIRCLE_KIT_KEY: ${NEXT_PUBLIC_CIRCLE_KIT_KEY:-}
      NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_KEY: ${NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_KEY:-}
      NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_URL: ${NEXT_PUBLIC_CIRCLE_PASSKEY_CLIENT_URL:-https://modular-sdk.circle.com/v1/rpc/w3s/buidl}
      NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ARC_TESTNET: ${NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ARC_TESTNET:-}
      NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ETH_SEPOLIA: ${NEXT_PUBLIC_CIRCLE_PASSKEY_MODULAR_RPC_URL_ETH_SEPOLIA:-}
      NEXT_PUBLIC_CIRCLE_PASSKEY_RP_ID: ${NEXT_PUBLIC_CIRCLE_PASSKEY_RP_ID:-app.wizpay.xyz}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://rpc.testnet.arc.io}
      NEXT_PUBLIC_ARC_TESTNET_RPC_URL: ${NEXT_PUBLIC_ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
      NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URLS: ${NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URLS:-}
      NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      NEXT_PUBLIC_OP_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_OP_SEPOLIA_RPC_URL:-https://sepolia.optimism.io}
      NEXT_PUBLIC_MONAD_TESTNET_RPC_URL: ${NEXT_PUBLIC_MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
      NEXT_PUBLIC_USE_REAL_STABLEFX: ${NEXT_PUBLIC_USE_REAL_STABLEFX:-false}
      NEXT_PUBLIC_CIRCLE_API_PROXY_ENABLED: ${NEXT_PUBLIC_CIRCLE_API_PROXY_ENABLED:-false}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      NEXT_PUBLIC_ARC_USDC: ${NEXT_PUBLIC_ARC_USDC:-}
      NEXT_PUBLIC_WIZPAY_SWAP_EXECUTOR_V2_ADDRESS: ${WIZPAY_SWAP_EXECUTOR_V2_ADDRESS:-0x7B5573759576AD3AD9F9E3b4425ad68FD2b525ed}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-}
      NEXT_PUBLIC_WIZPAY_ADDRESS: ${NEXT_PUBLIC_WIZPAY_ADDRESS:-}
      NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS: ${NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS:-}
      # ── Server-side runtime vars (Next.js API routes, not bundled) ──────────
      # IMPORTANT: Add http://localhost:3000 to Circle Console → Allowed Origins
      CIRCLE_API_KEY: ${CIRCLE_API_KEY}
      CIRCLE_BASE_URL: ${CIRCLE_BASE_URL}
      CIRCLE_ENTITY_SECRET: ${CIRCLE_ENTITY_SECRET}
      CIRCLE_WALLETS_BASE_URL: ${CIRCLE_WALLETS_BASE_URL}
      CIRCLE_TRANSFER_BLOCKCHAIN: ${CIRCLE_TRANSFER_BLOCKCHAIN}
      CIRCLE_TRANSFER_FEE_LEVEL: ${CIRCLE_TRANSFER_FEE_LEVEL}
      CIRCLE_WALLET_ID_ARC: ${CIRCLE_WALLET_ID_ARC}
      CIRCLE_WALLET_ID_SEPOLIA: ${CIRCLE_WALLET_ID_SEPOLIA}
      CIRCLE_WALLET_ID_SOLANA: ${CIRCLE_WALLET_ID_SOLANA}
      CIRCLE_WALLET_SET_ID_ARC: ${CIRCLE_WALLET_SET_ID_ARC}
      CIRCLE_WALLET_SET_ID_SEPOLIA: ${CIRCLE_WALLET_SET_ID_SEPOLIA}
      CIRCLE_WALLET_SET_ID_SOLANA: ${CIRCLE_WALLET_SET_ID_SOLANA}
      CIRCLE_WALLET_ADDRESS_ARC: ${CIRCLE_WALLET_ADDRESS_ARC}
      CIRCLE_WALLET_ADDRESS_SEPOLIA: ${CIRCLE_WALLET_ADDRESS_SEPOLIA}
      CIRCLE_WALLET_ADDRESS_SOLANA: ${CIRCLE_WALLET_ADDRESS_SOLANA}
      BRIDGE_DATABASE_URL: ${DATABASE_URL}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - wizpay-network

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wizpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wizpay}
      POSTGRES_DB: ${POSTGRES_DB:-wizpay}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wizpay} -d ${POSTGRES_DB:-wizpay}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wizpay-network

networks:
  wizpay-network:
    driver: bridge

volumes:
  postgres_data:
