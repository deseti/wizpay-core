name: wizpay-arc-mainnet

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DOCKER: "true"
      WIZPAY_ARC_NETWORK: arc-mainnet
      WIZPAY_API_NETWORK: arc-mainnet
      WIZPAY_WORKER_NETWORK: arc-mainnet
      WIZPAY_MIGRATION_NETWORK: arc-mainnet
      ARC_MAINNET_DATABASE_URL: ${ARC_MAINNET_DATABASE_URL:?ARC_MAINNET_DATABASE_URL is required}
      ARC_MAINNET_REDIS_URL: ${ARC_MAINNET_REDIS_URL:?ARC_MAINNET_REDIS_URL is required}
      ARC_MAINNET_QUEUE_PREFIX: ${ARC_MAINNET_QUEUE_PREFIX:-wizpay:arc-mainnet}

      # ── Arc Mainnet capabilities ─────────────────────────────────────────
      WIZPAY_ARC_MAINNET_CAPABILITY_SEND: ${WIZPAY_ARC_MAINNET_CAPABILITY_SEND:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_SAME_TOKEN_PAYROLL: ${WIZPAY_ARC_MAINNET_CAPABILITY_SAME_TOKEN_PAYROLL:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_INVOICE: ${WIZPAY_ARC_MAINNET_CAPABILITY_INVOICE:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_PAYMENT_LINK: ${WIZPAY_ARC_MAINNET_CAPABILITY_PAYMENT_LINK:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_SWAP: ${WIZPAY_ARC_MAINNET_CAPABILITY_SWAP:-false}
      WIZPAY_ARC_MAINNET_CAPABILITY_CROSS_TOKEN_PAYROLL: ${WIZPAY_ARC_MAINNET_CAPABILITY_CROSS_TOKEN_PAYROLL:-false}

      # ── CORS ─────────────────────────────────────────────────────────────
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wizpay-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - wizpay-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # ── Build-time args ───────────────────────────────────────────────────
      # docker-compose auto-loads the root .env file, so ${VAR} here resolves
      # from .env without any shell export. Values are baked into the Next.js
      # bundle during `npm run build` in the Dockerfile builder stage.
      #
      # To change a value: edit root .env, then rebuild with:
      #   docker compose down && docker compose up --build
      args:
        WIZPAY_ARC_NETWORK: arc-mainnet
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL: ${NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_BACKEND_API_BASE_URL: ${NEXT_PUBLIC_BACKEND_API_BASE_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
        NEXT_PUBLIC_INVOICE_API_PREFIX: ${NEXT_PUBLIC_INVOICE_API_PREFIX:-}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:?NEXT_PUBLIC_REOWN_PROJECT_ID is required}
        NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS: ${NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS:-}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      WIZPAY_ARC_NETWORK: arc-mainnet
      # ── Frontend runtime vars (Next.js dev server / SSR) ───────────────────
      # Keep these sourced from the root .env so docker-compose.dev does not
      # depend on apps/frontend/.env.local.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL: ${NEXT_PUBLIC_WIZPAY_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKEND_API_BASE_URL: ${NEXT_PUBLIC_BACKEND_API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_INVOICE_API_PREFIX: ${NEXT_PUBLIC_INVOICE_API_PREFIX:-}
      NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:?NEXT_PUBLIC_REOWN_PROJECT_ID is required}
      NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS: ${NEXT_PUBLIC_WIZPAY_AGENTIC_NANO_ADDRESS:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - wizpay-network

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wizpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wizpay}
      POSTGRES_DB: ${POSTGRES_DB:-wizpay}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wizpay} -d ${POSTGRES_DB:-wizpay}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wizpay-network

networks:
  wizpay-network:
    name: wizpay-arc-mainnet
    driver: bridge

volumes:
  postgres_data:
    name: wizpay-arc-mainnet-postgres
