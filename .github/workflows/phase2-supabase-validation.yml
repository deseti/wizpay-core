name: Phase 2 clean Supabase validation

on:
  push:
    branches: [feat/serverless-free-stack]
    paths:
      - .github/workflows/phase2-supabase-validation.yml
      - apps/backend/test/validate-live-supabase.ts
      - .github/scripts/phase2-oidc-bootstrap.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: phase2-clean-supabase-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/serverless-free-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client without database credentials
        run: npm run prisma:generate -w backend
      - name: Request OIDC, reuse Vault CI credential, verify CA, and collect live evidence
        run: node .github/scripts/phase2-oidc-bootstrap.mjs bootstrap
      - name: Clean run objects and preserve the stable CI credential using fresh OIDC
        if: always()
        run: node .github/scripts/phase2-oidc-bootstrap.mjs cleanup
      - name: Verify unchanged checkout
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
