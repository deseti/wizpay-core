name: CD Production

on:
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.WIZPAY_VM_SSH_KEY }}" > ~/.ssh/wizpay_deploy_key
          chmod 600 ~/.ssh/wizpay_deploy_key
          ssh-keyscan -H "${{ secrets.WIZPAY_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/wizpay_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.WIZPAY_VM_USER }}@${{ secrets.WIZPAY_VM_HOST }}" \
            'hostname && whoami && docker ps --format "table {{.Names}}\t{{.Status}}" | head'

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/wizpay_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.WIZPAY_VM_USER }}@${{ secrets.WIZPAY_VM_HOST }}" \
            'set -euo pipefail
             cd /home/wizpay/apps/wizpay/repo
             test -z "$(git status --short)"
             git fetch origin main
             git merge --ff-only origin/main
             docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml build backend frontend
             docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml up -d postgres redis backend frontend
             containers_healthy=false
             for attempt in $(seq 1 30); do
               backend_health=$(docker inspect -f "{{.State.Health.Status}}" wizpay-backend-1 2>/dev/null || true)
               frontend_health=$(docker inspect -f "{{.State.Health.Status}}" wizpay-frontend-1 2>/dev/null || true)
               if [ "$backend_health" = "healthy" ] && [ "$frontend_health" = "healthy" ]; then
                 containers_healthy=true
                 break
               fi
               if [ "$attempt" -lt 30 ]; then
                 sleep 5
               fi
             done
             if [ "$containers_healthy" != "true" ]; then
               docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml ps
               docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml logs --tail=100 backend
               docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml logs --tail=100 frontend
               exit 1
             fi
             systemctl is-active --quiet caddy
             curl -fsS http://127.0.0.1:3100 >/dev/null
             curl -fsS http://127.0.0.1:4100/tasks >/dev/null
             invoice_headers=$(mktemp)
             invoice_body=$(mktemp)
             invoice_status=$(curl -ksS \
               --resolve app.wizpay.xyz:443:127.0.0.1 \
               -D "$invoice_headers" \
               -o "$invoice_body" \
               -w "%{http_code}" \
               https://app.wizpay.xyz/api/invoices)
             if [ "$invoice_status" != "401" ] || \
                ! grep -qi "^content-type:.*application/json" "$invoice_headers" || \
                grep -Eqi "<!doctype|<html" "$invoice_body" || \
                ! grep -Eq "\"code\"[[:space:]]*:[[:space:]]*\"INVOICE_AUTH_REQUIRED\"" "$invoice_body"; then
               echo "Invoice API proxy health check failed (status=$invoice_status)"
               rm -f "$invoice_headers" "$invoice_body"
               exit 1
             fi
             rm -f "$invoice_headers" "$invoice_body"
             docker compose -p wizpay -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps2.yml ps'
