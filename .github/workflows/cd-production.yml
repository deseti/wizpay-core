name: CD Production Backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ARC_MAINNET_BACKEND_ONLY to continue
        required: true
        type: string

concurrency:
  group: cd-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Arc Mainnet backend
    if: ${{ inputs.confirmation == 'ARC_MAINNET_BACKEND_ONLY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.WIZPAY_VM_SSH_KEY }}" > ~/.ssh/wizpay_deploy_key
          chmod 600 ~/.ssh/wizpay_deploy_key
          ssh-keyscan -H "${{ secrets.WIZPAY_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/wizpay_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.WIZPAY_VM_USER }}@${{ secrets.WIZPAY_VM_HOST }}" \
            'hostname && whoami'

      - name: Deploy backend-only Arc Mainnet stack
        run: |
          ssh -i ~/.ssh/wizpay_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.WIZPAY_VM_USER }}@${{ secrets.WIZPAY_VM_HOST }}" \
            'set -euo pipefail
             deploy_dir=/home/wizpay/apps/wizpay/repo
             env_file=/home/wizpay/apps/wizpay/arc-mainnet.env
             test -f "$env_file"
             test ! -L "$env_file"
             cd "$deploy_dir"
             test "$(git branch --show-current)" = main
             test -z "$(git status --short)"
             git fetch origin main
             git merge --ff-only origin/main
             compose="docker compose --env-file $env_file -f deploy/arc-mainnet/compose.yml"
             $compose config --quiet
             $compose build backend migrate
             $compose up -d postgres redis
             $compose --profile migration run --rm migrate
             $compose up -d backend
             backend_id=$($compose ps -q backend)
             test -n "$backend_id"
             backend_healthy=false
             for attempt in $(seq 1 30); do
               backend_health=$(docker inspect -f "{{.State.Health.Status}}" "$backend_id" 2>/dev/null || true)
               if [ "$backend_health" = healthy ]; then
                 backend_healthy=true
                 break
               fi
               if [ "$attempt" -lt 30 ]; then
                 sleep 5
               fi
             done
             if [ "$backend_healthy" != true ]; then
               $compose ps
               $compose logs --tail=100 backend
               exit 1
             fi
             backend_endpoint=$($compose port backend 4000)
             test -n "$backend_endpoint"
             curl -fsS "http://$backend_endpoint/health" >/dev/null
             runtime=$(curl -fsS "http://$backend_endpoint/health/runtime-isolation")
             printf "%s" "$runtime" | grep -q '"network":"arc-mainnet"'
             $compose ps'
